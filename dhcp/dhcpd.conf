# ISC DHCP configuration for the internal 192.168.1.0/24 network.

# Clients are placed in the student-specific DNS domain and use
# the server at 192.168.1.1 for DNS resolution.
option domain-name "student75872.lan";
option domain-name-servers 192.168.1.1;

# A 24-hour default lease is long enough for a stable lab network
# while still allowing addresses to be reused when clients leave.
default-lease-time 86400;

# The maximum lease is 48 hours.
max-lease-time 172800;

# Dynamic DNS updates are not required because the DNS records
# used for this assignment are configured statically in BIND9.
ddns-update-style none;

# This is the authoritative DHCP server for the internal network.
authoritative;

subnet 192.168.1.0 netmask 255.255.255.0 {

    # Dynamic addresses available to DHCP clients.
    range 192.168.1.150 192.168.1.200;

    # The Linux server acts as the client's default gateway.
    option routers 192.168.1.1;

    option subnet-mask 255.255.255.0;
    option broadcast-address 192.168.1.255;
}
