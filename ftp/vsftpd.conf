# vsftpd configuration for Assignment 2.

# Listen as a standalone service.
listen=NO
listen_ipv6=YES

# Anonymous access is disabled.
# Only authenticated local Linux users may log in.
anonymous_enable=NO
local_enable=YES

# Allow authenticated users to upload and modify files.
write_enable=YES

# Restrict local users to their own home directories.
chroot_local_user=YES

# The FTP user's home directory is writable, so this option is
# required for chrooted write access.
allow_writeable_chroot=YES

# Enable passive FTP mode.
# The assignment specifies ports 40000-40100.
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100

# Record FTP upload and download activity.
xferlog_enable=YES

# Use the server's local time in directory listings.
use_localtime=YES

# Active-mode data connections use FTP data port 20.
connect_from_port_20=YES

# Directory used internally by vsftpd for secure chroot operations.
secure_chroot_dir=/var/run/vsftpd/empty

# Use the standard PAM authentication configuration for vsftpd.
pam_service_name=vsftpd

# TLS is not required by the assignment.
ssl_enable=NO
