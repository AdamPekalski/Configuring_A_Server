#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain forward {
        type filter hook forward priority 0;
        policy drop;

        # Allow established and related return traffic
        ct state established,related accept

        # Allow internal DHCP clients to access external networks
        iifname "enp0s2" oifname "enp0s1" ip saddr 192.168.1.0/24 accept
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100;

        # Hide internal client addresses behind the server's external address
        oifname "enp0s1" ip saddr 192.168.1.0/24 masquerade
    }
}
